apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-php-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tertolhumper/sentinel-nsm-config.git
    targetRevision: main
    path: apps/lemp
  destination:
    server: https://kubernetes.default.svc
    namespace: lemp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
