apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-nsm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tertolhumper/sentinel-nsm-config.git
    targetRevision: main
    path: helm/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
