apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-fpm
  namespace: lemp
spec:
  replicas: 4
  selector:
    matchLabels:
      app: php-fpm
  template:
    metadata:
      labels:
        app: php-fpm
    spec:
      containers:
      - name: php-fpm
        image: ghcr.io/tertolhumper/sentinel-nsm-app:22
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
        env:
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: sentinel-app-secrets
              key: VAULT_TOKEN
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-passwords
              key: mariadb-password
        volumeMounts:
        - mountPath: /var/www/html
          name: php-app
        - mountPath: /usr/local/etc/php-fpm.d/www.conf
          name: php-fpm-config
          subPath: www.conf
      volumes:
      - name: php-app
        configMap:
          name: php-app
      - name: php-fpm-config
        configMap:
          name: php-fpm-config
