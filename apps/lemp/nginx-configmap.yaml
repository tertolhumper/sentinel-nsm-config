apiVersion: v1
data:
  default.conf: "server {\n    listen 80;\n    root /var/www/html;\n    index index.php\
    \ index.html;\n\n    location / {\n        try_files $uri $uri/ /index.php?$args;\n\
    \    }\n\n    location ~ \\.php$ {\n        fastcgi_pass php-fpm:9000;\n     \
    \   fastcgi_index index.php;\n        include fastcgi_params;\n        fastcgi_param\
    \ SCRIPT_FILENAME $document_root$fastcgi_script_name;\n    }\n}\n"
