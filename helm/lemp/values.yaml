# Passwords managed via Vault + ESO — do not hardcode here
# See vault secret: secret/lemp

mariadb:
  auth:
    existingSecret: mariadb-secret
    database: calmapps
    username: calmapps
  primary:
    persistence:
      enabled: false
    livenessProbe:
      enabled: true
      initialDelaySeconds: 120
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1

nginx:
  service:
    type: NodePort
    nodePort: 30080
  replicas: 2

phpfpm:
  replicas: 2
