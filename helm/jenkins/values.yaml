controller:
  image:
    registry: ghcr.io
    repository: tertolhumper/sentinel-nsm-jenkins
    tag: latest
    pullPolicy: Always
  serviceType: NodePort
  nodePort: 30082
  admin:
    createSecret: false
    existingSecret: jenkins-admin-secret
  installPlugins: []
  containerEnv:
    - name: chart-admin-username
      valueFrom:
        secretKeyRef:
          name: jenkins-admin-secret
          key: jenkins-admin-user
    - name: chart-admin-password
      valueFrom:
        secretKeyRef:
          name: jenkins-admin-secret
          key: jenkins-admin-password

persistence:
  enabled: true
  storageClass: nfs-client
  size: 10Gi
